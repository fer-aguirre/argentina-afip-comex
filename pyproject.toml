[project]
name = "arca_comex"
version = "0.1.0"
description = "Análisis de datos de ARCA para comercio exterior en Argentina"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Fernanda Aguirre Ruiz"}
]

dependencies = [
    "ipykernel",
    "nbformat",
    "pandas",
    "numpy",
    "requests",
    "plotly",
    "openpyxl",
    "beautifulsoup4>=4.15.0",
    "polars>=1.44.2",
    "tqdm>=4.70.1",
    "ipywidgets>=8.1.9",
    "xlsxwriter",
]

[project.scripts]
arca-comex-query = "arca_comex.query:main"

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]
